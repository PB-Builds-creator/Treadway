<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Treadway</title>
  <desc id="desc">Four flat trail stones set into the ground, with a rising way worn across them.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="72" x2="876" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6f8397"/>
      <stop offset=".52" stop-color="#43566b"/>
      <stop offset="1" stop-color="#263544"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(330 220) rotate(48) scale(610)">
      <stop stop-color="#f3ddaa" stop-opacity=".3"/>
      <stop offset=".72" stop-color="#f3ddaa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone1" x1="14" y1="84" x2="74" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bbc3c7"/><stop offset=".45" stop-color="#8e9ba1"/><stop offset="1" stop-color="#64727b"/>
    </linearGradient>
    <linearGradient id="stone2" x1="25" y1="65" x2="72" y2="83" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c8ccca"/><stop offset=".5" stop-color="#96a09f"/><stop offset="1" stop-color="#687577"/>
    </linearGradient>
    <linearGradient id="stone3" x1="24" y1="49" x2="62" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d5d3c9"/><stop offset=".5" stop-color="#a7aaa5"/><stop offset="1" stop-color="#737c7b"/>
    </linearGradient>
    <linearGradient id="stone4" x1="34" y1="34" x2="63" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0dacb"/><stop offset=".55" stop-color="#afb0a8"/><stop offset="1" stop-color="#777e79"/>
    </linearGradient>
    <linearGradient id="blaze" x1="39" y1="107" x2="49" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0d49d"/><stop offset=".55" stop-color="#fff0c8"/><stop offset="1" stop-color="#f2cf83"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed: fills the entire square so iOS/Android apply their own corner mask with no white edges. -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#light)"/>
  <path d="M60 851C271 749 399 765 512 818c150 70 280 24 452-96v243H60Z" fill="#172431" opacity=".28"/>
  <g transform="translate(141 -193) scale(9.4)" stroke="#303a3e" stroke-opacity=".52" stroke-width="1.1" stroke-linejoin="round">
    <path d="M22 100C30 94 34 87 41 80 48 72 62 57 71 47" fill="none" stroke="#27343e" stroke-opacity=".32" stroke-width="7.4" stroke-linecap="round"/>
    <path d="M22 100C30 94 34 87 41 80 48 72 62 57 71 47" fill="none" stroke="url(#blaze)" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M2 99c0-4 7-7 16-7 10-1 22 1 26 4 3 2 1 5-5 6-9 2-24 2-32 0-4-1-6-2-5-3Z" fill="url(#stone1)"/>
    <path d="M26 80c0-3 5-5 11-6 8 0 16 1 18 3 2 1 1 4-4 5-7 1-17 1-22 0-3-1-4-1-3-2Z" fill="url(#stone2)"/>
    <path d="M46 63c0-2 4-3 8-4 5 0 11 1 12 2 1 1 1 3-3 3-5 1-12 1-15 0-2-1-2-1-2-1Z" fill="url(#stone3)"/>
    <path d="M63 48c0-1 2-2 5-3 4 0 8 1 8 2 1 1 0 2-2 2-3 1-8 1-10 0-1 0-1 0-1-1Z" fill="url(#stone4)"/>
    <path d="M7 96c10-2 26-2 34 0" fill="none" stroke="#fff" stroke-opacity=".15" stroke-width="1.15" stroke-linecap="round"/>
    <path d="M30 78c7-2 16-2 21 0" fill="none" stroke="#fff" stroke-opacity=".15" stroke-width=".9" stroke-linecap="round"/>
  </g>
</svg>
