name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  core:
    name: CairnCore
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: CairnCore
      - run: swift run cairncore-verify
        working-directory: CairnCore
